[project]
name = "normattiva-sdk"
description = "SDK non ufficiale per Normattiva, il portale della legge vigente dello Stato italiano"
readme = "README.md"
license = "MIT"
authors = [{ name = "Irene Burresi" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
]
dynamic = ["version"]
keywords = ["normattiva", "leggi", "normativa", "akoma-ntoso", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Italian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
normattiva = "normattiva.cli:main"

[project.urls]
Repository = "https://github.com/ireneburresi/normattiva-sdk"
Issues = "https://github.com/ireneburresi/normattiva-sdk/issues"
Changelog = "https://github.com/ireneburresi/normattiva-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "time-machine>=2.14",
    "ty>=0.0.1a21",
]
docs = [
    "mkdocs-llmstxt>=0.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normattiva"]

[tool.hatch.build.targets.sdist]
exclude = [".hypothesis", ".pytest_cache", ".ruff_cache", "dist"]

[tool.hatch.version]
path = "src/normattiva/__init__.py"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # regole specifiche di ruff
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not rete' --timeout=60"
filterwarnings = ["error"]
markers = [
    "rete: prova di contratto che interroga il servizio reale",
    "slow: prova che richiede più di qualche secondo",
]

[tool.hypothesis]
max_examples = 200

[tool.coverage.run]
source = ["normattiva"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
